apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-backup-config
  namespace: database-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: database-backup-config-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        config.yaml: |
          # Database Backup System Configuration
          # Generated from External Secret Operator

          # PostgreSQL Database Configuration
          pgsql:
          - id: immich
            host: immich.pgsql.nullservers.com
            port: 5432
            database: immich
            username: {{ .immich_username }}
            password: {{ .immich_password }}
          - id: authentik
            host: pgsql.nullservers.com
            port: 5432
            database: authentik
            username: {{ .authentik_username }}
            password: {{ .authentik_password }}
          - id: recipes
            host: pgsql.nullservers.com
            port: 5432
            database: recipes
            username: {{ .recipes_username }}
            password: {{ .recipes_password }}
          - id: joplin
            host: pgsql.nullservers.com
            port: 5432
            database: joplin
            username: {{ .joplin_username }}
            password: {{ .joplin_password }}
          - id: vaultwarden
            host: pgsql.nullservers.com
            port: 5432
            database: vaultwarden
            username: {{ .vaultwarden_username }}
            password: {{ .vaultwarden_password }}
          - id: infisical
            host: pgsql.nullservers.com
            port: 5432
            database: infisical
            username: {{ .infisical_username }}
            password: {{ .infisical_password }}

          # FTP Configuration (optional)
          ftp:
            host: ftp.nullservers.com
            port: 21
            username: {{ .ftp_username }}
            password: {{ .ftp_password }}
            remote_dir: /databases/
            ssl: false

          # Telegram Configuration
          telegram:
            bot_token: {{ .telegram_bot_token }}
            chat_id: {{ .telegram_chat_id }}
            enabled: true

          # Backup Configuration
          backup:
            directory: /app/backups
            retention_days: 7
            compression: true
            log_level: INFO
            verbose: false
  data:
    # PostgreSQL Configuration -- Immich
    - secretKey: immich_username
      remoteRef:
        key: database-immich/DB_USERNAME
    - secretKey: immich_password
      remoteRef:
        key: database-immich/DB_PASSWORD
    # PostgreSQL Configuration -- Authentik
    - secretKey: authentik_username
      remoteRef:
        key: database-authentik/DB_USERNAME
    - secretKey: authentik_password
      remoteRef:
        key: database-authentik/DB_PASSWORD
    # Recipes PostgreSQL Configuration
    - secretKey: recipes_username
      remoteRef:
        key: database-recipes/DB_USERNAME
    - secretKey: recipes_password
      remoteRef:
        key: database-recipes/DB_PASSWORD

    # Joplin PostgreSQL Configuration
    - secretKey: joplin_username
      remoteRef:
        key: database-joplin/DB_USERNAME
    - secretKey: joplin_password
      remoteRef:
        key: database-joplin/DB_PASSWORD

    # Vaultwarden PostgreSQL Configuration
    - secretKey: vaultwarden_username
      remoteRef:
        key: database-vaultwarden/DB_USERNAME
    - secretKey: vaultwarden_password
      remoteRef:
        key: database-vaultwarden/DB_PASSWORD

    # Infisical PostgreSQL Configuration
    - secretKey: infisical_username
      remoteRef:
        key: database-infisical/DB_USERNAME
    - secretKey: infisical_password
      remoteRef:
        key: database-infisical/DB_PASSWORD

    # MongoDB Configuration (uncomment as needed)
    - secretKey: mongodb_username
      remoteRef:
        key: database-tibia-statistics/DB_USERNAME
    - secretKey: mongodb_password
      remoteRef:
        key: database-tibia-statistics/DB_PASSWORD

    # FTP Configuration (uncomment as needed)
    - secretKey: ftp_username
      remoteRef:
        key: truenas/database-backup/username
    - secretKey: ftp_password
      remoteRef:
        key: truenas/database-backup/password

    # Telegram Configuration
    - secretKey: telegram_bot_token
      remoteRef:
        key: telegram/bot/password
    - secretKey: telegram_chat_id
      remoteRef:
        key: telegram/bot/chat-id
