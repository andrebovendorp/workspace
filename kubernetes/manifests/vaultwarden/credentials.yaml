apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-credentials
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: vaultwarden-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        admin-token: "{{ .admin_token }}"
        PUSH_INSTALLATION_ID: "{{ .installation_id  }}"
        PUSH_INSTALLATION_KEY: "{{ .installation_key }}"
        SMTP_PASSWORD: "{{ .smtp_password }}"
        DATABASE_URL: "postgresql://vaultwarden:{{ .database_password }}@pgsql.nullservers.com:5432/vaultwarden"
        SSO_CLIENT_ID: "{{ .sso_client_id }}"
        SSO_CLIENT_SECRET: "{{ .sso_client_secret }}"
  data:
    - secretKey: admin_token
      remoteRef:
        key: vaultwarden/token
    - secretKey: installation_id
      remoteRef:
        key: vaultwarden/installationId
    - secretKey: installation_key
      remoteRef:
        key: vaultwarden/installationKey
    - secretKey: smtp_password
      remoteRef:
        key: vaultwarden/resend-apikey
    - secretKey: database_password
      remoteRef:
        key: database-vaultwarden/DB_PASSWORD
    - secretKey: sso_client_id
      remoteRef:
        key: vaultwarden/ssoClientId
    - secretKey: sso_client_secret
      remoteRef:
        key: vaultwarden/ssoClientSecret
