apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: duplicati-credentials
  namespace: duplicati
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    creationPolicy: Owner
    name: duplicati-credentials
  data:
    - secretKey: password
      remoteRef:
        conversionStrategy: Default
        metadataPolicy: None
        key: duplicati/password
        decodingStrategy: None
    - secretKey: username
      remoteRef:
        conversionStrategy: Default
        metadataPolicy: None
        key: duplicati/username
        decodingStrategy: None
    - secretKey: encryption-key
      remoteRef:
        conversionStrategy: Default
        metadataPolicy: None
        key: duplicati/encryption-key
        decodingStrategy: None
    - secretKey: ui-credentials
      remoteRef:
        conversionStrategy: Default
        metadataPolicy: None
        key: duplicati/ui-credentials
        decodingStrategy: None
