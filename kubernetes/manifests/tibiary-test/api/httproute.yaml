# A classic networking.k8s.io/v1 Ingress is an alternative. TLS terminates at
# the Gateway; the internal backend speaks plain HTTP.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tibiary-api
  annotations:
    external-dns.alpha.kubernetes.io/hostname: tibiary-api.nullservers.com
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: https-wildcard
  hostnames:
    - tibiary-api.nullservers.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: tibiary-api
          port: 80
