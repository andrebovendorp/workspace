apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tibiary
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/manifests/tibiary
  prune: true
  sourceRef:
    kind: GitRepository
    name: workspace
  targetNamespace: tibiary
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tibiary-test
  namespace: flux-system
spec:
  interval: 1h
  path: ./kubernetes/manifests/tibiary-test
  prune: true
  sourceRef:
    kind: GitRepository
    name: workspace
  targetNamespace: tibiary-test
