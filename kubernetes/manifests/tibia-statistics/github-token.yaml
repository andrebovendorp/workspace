apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gh-docker-pat
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: gh-docker-pat
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ .username }}",
                "password": "{{ .password }}"
              }
            }
          }
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: github/pat
    - secretKey: username
      remoteRef:
        key: github/username
