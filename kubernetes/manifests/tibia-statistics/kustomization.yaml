apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - cronjob.yaml
  - cnp.yaml
  - github-token.yaml
  - tibia-statistics-mongo-credentials.yaml

commonLabels:
  app: tibia-statistics
  component: tibia-statistics

namespace: tibia-statistics

images:
  - name: ghcr.io/andrebovendorp/tibia-statistics
    newTag: latest