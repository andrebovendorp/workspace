apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tibia-statistics
  namespace: tibia-statistics
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: tibia-statistics
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: tibia-statistics
    - toFQDNs:
        - matchName: "mongodb.nullservers.com"
        - matchName: "assets.tibiadata.com"
        - matchName: "www.tibia.com"
        - matchName: "tibia.com"
