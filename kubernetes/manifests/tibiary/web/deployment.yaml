apiVersion: apps/v1
kind: Deployment
metadata:
  name: tibiary-web
  labels:
    app.kubernetes.io/name: tibiary-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tibiary-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tibiary-web
    spec:
      imagePullSecrets:
        - name: gitlab-pat
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: registry.gitlab.com/tibiary/tibiary-web
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tibiary-web-config
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
