apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-token
  namespace: cert-manager
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    creationPolicy: Owner
    name: cloudflare-api-token-secret
  data:
    - secretKey: password
      remoteRef:
        key: cloudflare/cert-manager/apikey
