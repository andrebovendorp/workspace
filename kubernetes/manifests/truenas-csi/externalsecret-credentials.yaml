apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-csi-credentials
  namespace: truenas-csi
spec:
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: truenas-csi-credentials
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: truenas/csi/apikey
