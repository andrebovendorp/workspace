apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cf-dns-updater-credentials
  namespace: dns-updater
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    creationPolicy: Owner
    name: cf-dns-updater-credentials
  data:
    - secretKey: zone-id
      remoteRef:
        conversionStrategy: Default
        metadataPolicy: None
        key: cloudflare/dns-updater/zone-id
        decodingStrategy: None
    - secretKey: account-id
      remoteRef:
        conversionStrategy: Default
        metadataPolicy: None
        key: cloudflare/account-id
        decodingStrategy: None
    - secretKey: api-key
      remoteRef:
        conversionStrategy: Default
        metadataPolicy: None
        key: cloudflare/dns-updater/api-key
        decodingStrategy: None
