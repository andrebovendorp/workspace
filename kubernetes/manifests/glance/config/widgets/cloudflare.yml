- type: custom-api
  title: Cloudflare Tunnel
  title-url: https://one.dash.cloudflare.com/
  cache: 1m
  url: https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/cfd_tunnel/${CF_TUNNEL_ID}
  headers:
    Authorization: Bearer ${CF_API_TOKEN}
    Accept: application/json
  template: |
    {{ if and (eq .Response.StatusCode 200) (.JSON.Bool "success") }}
      {{ $status := .JSON.String "result.status" }}
      <ul class="list list-gap-10">
        <li class="flex justify-between items-center">
          <span>STATUS</span>
          <span class="{{ if eq $status "healthy" }}color-positive{{ else }}color-negative{{ end }}">{{ $status }}</span>
        </li>
        <li class="flex justify-between items-center">
          <span>ORIGIN IP</span>
          <span class="color-highlight">{{ $origin := .JSON.String "result.connections.0.origin_ip" }}{{ if eq $origin "" }}N/A{{ else }}{{ $origin }}{{ end }}</span>
        </li>
        <li class="flex justify-between items-center">
          <span>CONNECTORS</span>
          <span class="color-highlight">{{ len (.JSON.Array "result.connections") }}</span>
        </li>
      </ul>
    {{ else }}
      <p class="color-negative">Tunnel status unavailable (HTTP {{ .Response.StatusCode }}).</p>
    {{ end }}
