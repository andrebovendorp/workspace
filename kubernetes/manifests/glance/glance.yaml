apiVersion: v1
kind: ConfigMap
metadata:
  name: glance
  namespace: glance
data:
  glance.yml: |-
    server:
      #assets-path: /app/assets

    theme:
      # Note: assets are cached by the browser, changes to the CSS file
      # will not be reflected until the browser cache is cleared (Ctrl+F5)
      # custom-css-file: /assets/user.css

    pages:
      - name: Home
        columns:
          - size: small
            widgets:
              - type: rss
                limit: 20
                collapse-after: 8
                cache: 1h
                feeds:
                  - url: https://g1.globo.com/rss/g1/politica/
                    title: G1 Política
                    limit: 4
              - $include: widget-epic.yml
              - type: twitch-channels
                channels:
                  - krolm009
                  - gaules

          - size: full
            widgets:
              - type: group
                widgets:
                  - type: rss
                    feeds:
                      - url: https://g1.globo.com/rss/g1/politica/
                        title: G1 Política
                        limit: 3
                  - type: rss
                    feeds:
                      - url: https://selfh.st/rss/
                        title: Selfhost
                        limit: 3

              - type: videos
                channels:
                  - UCXuqSBlHAE6Xw-yeJA0Tunw # Linus Tech Tips
                  - UCR-DXc1voovS8nhAvccRZhg # Jeff Geerling
                  - UCzgA9CBrIXPtkB2yNTTiy1w # Jeff Geerling 2
                  - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
                  - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium
              
              - type: group
                widgets:
                  - $include: widget-tautulli.yml

          - size: small
            widgets:
              - type: weather
                location: Uppsala, Sweden
                units: metric
                hour-format: 24h

              - type: markets
                markets:
                  - symbol: SPY
                    name: S&P 500
                  - symbol: NVDA
                    name: NVIDIA
                  - symbol: AZUL4.SA
                    name: Azul
                  - symbol: HM-B.ST
                    name: H&M
                  - symbol: VOLCAR-B.ST
                    name: Volvo

              - type: releases
                cache: 1h
                repositories:
                  - glanceapp/glance
                  - immich-app/immich
                  - TandoorRecipes/recipes
              - type: bookmarks
                groups: 
                  - links: 
                    - title: Github
                      url: https://github.com/boveloco
                    - title: Workspace
                      url: https://github.com/andrebovendorp/workspace
      - name: News
        columns:
          - size: small # Noticias Brazil
            widgets:
              - type: rss
                limit: 10
                collapse-after: 10
                cache: 1h
                feeds:
                  - url: https://g1.globo.com/rss/g1/politica/
                    title: G1 Política
                    limit: 4
                  - url: https://g1.globo.com/dynamo/brasil/rss2.xml
                    title: G1 Brasil
                    limit: 4
                  - url: https://g1.globo.com/dynamo/economia/rss2.xml
                    title: G1 Economia
                    limit: 4

          - size: full # Geral
            widgets: 
              - type: rss
                limit: 20
                collapse-after: 12
                cache: 1h
                feeds:
                  - url: https://feeds.feedburner.com/XadrezVerbal
                    title: Xadrez Verbal
                    limit: 4
                  - url: https://www.unt.se/rss/lokalt/uppsala
                    title: UNT Uppsala
                    limit: 4
              - type: videos
                channels:
                  - UCT6Imb3GXhF8GmjpIk6y2lg # Professor Ricardo Marcilio
                  - UCP5tjEmvPItGyLhmjdwP7Ww # Real Life Lore
                  - UCBJycsmduvYEL83R_U4JriQ # Marques Brownlee
                  - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium
              
          - size: small # Noticias Sweden
            widgets:
              - type: rss
                limit: 10
                collapse-after: 8
                cache: 1h
                feeds:
                  - url: https://www.unt.se/rss/lokalt/uppsala
                    title: UNT Uppsala
                    limit: 4
                  - url: https://www.dn.se/rss/
                    title: Dagens Nyheter
                    limit: 2
      - $include: infrastructure.yml
