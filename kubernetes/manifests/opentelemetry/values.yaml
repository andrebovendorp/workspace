opentelemetry-operator:
  crds:
    create: true
  manager:
    serviceMonitor:
      enabled: true
    collectorImage:
      repository: "otel/opentelemetry-collector-contrib"
      tag: "0.165.0"
    resources:
      limits:
        memory: 180Mi
      requests:
        cpu: 100m
        memory: 180Mi
  admissionWebhooks:
    autoGenerateCert:
      enabled: false
    certManager:
      enabled: true
