apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: cloudflare-metrics
  namespace: cloudflare
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  namespaceSelector:
    matchNames:
      - cloudflare
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
